<title>Class 12 – Fachschaft Englisch FOSBOS Weiden</title>
<link rel="icon" href="../logo-fachschaft-englisch.png">
<style>
:root{--green:#97b400;--green-d:#5a6b00;--green-t:#f3f8e2;--ink:#1f2418;--bg:#fbfbf8;--line:#e2e5d8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:#fff;border-bottom:3px solid var(--green);display:flex;align-items:center;gap:14px;padding:10px 18px}
header img{height:72px;width:auto}
header .k{font-size:11px;letter-spacing:.12em;color:var(--green-d);font-weight:600;text-transform:uppercase}
header h1{font-size:20px;margin:0;line-height:1.2}
main{max-width:720px;margin:0 auto;padding:28px 18px}
a.card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;padding:16px;color:inherit;text-decoration:none;margin-bottom:12px}
a.card:hover{background:var(--green-t)}
a.card img{width:48px;height:48px;border-radius:10px;flex:none}
a.card strong{display:block;font-size:1.1rem;color:var(--green-d)}
h2{font-size:15px;margin:26px 0 10px;color:var(--green-d);text-transform:uppercase;letter-spacing:.08em}
h2 small{font-size:11px;color:#7a8070;text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
h3{font-size:14px;margin:16px 0 8px;font-weight:600;color:var(--ink)}
a.card .ic{width:48px;height:48px;border-radius:10px;background:var(--green-t);display:grid;place-items:center;font-size:22px;flex:none}
a.back{display:inline-block;margin-bottom:6px;color:var(--green-d);text-decoration:none;font-weight:600}
a.back:hover{text-decoration:underline}
footer{text-align:center;font-size:12px;color:#7a8070;padding:24px}
</style>
</head>
<body>
<header>
<a href="../"><img src="../logo-fachschaft-englisch.png" alt="Logo Fachschaft Englisch"></a>

</header>

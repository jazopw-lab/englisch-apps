<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Trainer – Fachschaft Englisch FOSBOS Weiden</title>
<meta name="theme-color" content="#97b400">
<meta name="description" content="Vocab Trainer der Fachschaft Englisch, FOSBOS Weiden – Vokabeln lernen mit Spaced Repetition.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Fonts are self-hosted (no requests to Google – GDPR) */
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/source-sans-3-latin-800-normal.woff2) format('woff2')}
:root{
  --g:#97b400; --g-dark:#4d5c00; --g-ink:#1c2400; --g-tint:#f4f8e4; --g-tint2:#e3eebb;
  --ink:#1d2416; --muted:#5f6857; --line:#dfe5d3; --bg:#fafbf6;
  --red:#b83227; --red-t:#fbe9e6; --amber:#9a6200; --amber-t:#fdf1da; --grey-t:#eef0ea;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#fff;border-bottom:4px solid var(--g)}
.hwrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px 6px}
.hwrap img{height:58px;width:auto}
.htitle{font-weight:800;font-size:1.45rem;letter-spacing:-.015em;line-height:1.1}
.hsub{color:var(--muted);font-size:.85rem}
nav{max-width:820px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;padding:10px 12px 9px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-4px}
nav button.on{color:var(--g-ink);border-bottom-color:var(--g-dark)}
main{max-width:820px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:1.25rem;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card.tint{background:var(--g-tint);border-color:var(--g-tint2)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:filter .1s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--g);color:var(--g-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.primary:disabled{background:var(--grey-t);color:#9aa292;cursor:default}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--g)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.danger{background:var(--red-t);color:var(--red)}
.btn.big{font-size:1.15rem;padding:14px 26px;min-height:56px}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--g-tint2);border-color:var(--g);color:var(--g-ink)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.st-new{background:var(--grey-t);color:#5d6458}
.st-learning{background:var(--amber-t);color:var(--amber)}
.st-familiar{background:var(--g-tint2);color:var(--g-dark)}
.st-mastered{background:var(--g-dark);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--g-tint2);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-weight:800}
.stat span{font-size:.82rem;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--grey-t)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.fc{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.fc div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.fc div i{display:block;background:var(--g);border-radius:4px 4px 0 0;margin:0 auto 3px;width:70%;min-height:2px}
input[type=text],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
textarea.prose{font-family:inherit;font-size:1rem;min-height:90px}
label.f{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
.warn{background:var(--amber-t);border:1px solid #f0d49b;color:#6b4500;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
/* session */
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--grey-t);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);transition:width .25s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:0 2px 0 var(--g-tint2)}
.mode{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--g-dark);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.prompt{font-size:1.9rem;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin:4px 0 6px;word-break:break-word}
.prompt.de{color:#2d3a12}
.prompt.def{font-size:1.25rem;font-weight:600}
.wc{color:var(--muted);font-weight:600;font-size:.95rem}
.ex{background:var(--g-tint);border-left:4px solid var(--g);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:1.05rem}
.ex b{color:var(--g-dark)}
.gapline{font-size:1.3rem;line-height:1.6;margin:8px 0 4px}
.gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--g);text-align:center;color:var(--g-dark);font-weight:700}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 16px;font-weight:600;cursor:pointer;font-size:1.05rem}
.opt:hover{border-color:var(--g)}
.opt.right{background:var(--g-tint2);border-color:var(--g)}
.opt.wrong{background:var(--red-t);border-color:var(--red)}
.answer-in{font-size:1.3rem;padding:13px 14px;margin-top:12px}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--g-tint);border:1.5px solid var(--g)}
.fb.mid{background:var(--amber-t);border:1.5px solid #e9c37a}
.fb.bad{background:var(--red-t);border:1.5px solid #e6aaa3}
.fb h4{margin:0 0 4px;font-size:1.05rem}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:12px;padding:10px 4px;font-weight:800;cursor:pointer;min-height:62px;line-height:1.15}
.rate button small{display:block;font-weight:600;font-size:.78rem;opacity:.85;margin-top:2px}
.r1{background:var(--red-t);color:var(--red)}
.r2{background:var(--amber-t);color:var(--amber)}
.r3{background:var(--g-tint2);color:var(--g-ink)}
.r4{background:var(--g-dark);color:#fff}
.speak{background:var(--g-tint);border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1.1rem;flex:none}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.kbd{font-size:.75rem;color:var(--muted)}
/* words */
.wl{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.wl li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.wl li:hover{background:var(--g-tint)}
.wl .w{flex:1;min-width:0}
.wl .w b{font-weight:700}
.wl .w div{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .due{font-size:.8rem;color:var(--muted);white-space:nowrap}
details>summary{cursor:pointer;font-weight:700;color:var(--g-dark);margin-top:10px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ "}
details[open]>summary::before{content:"▾ "}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cfd5c6;border-radius:14px;transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.toggle input:checked+span{background:var(--g)}
.toggle input:checked+span::after{left:21px}
table.prev{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
table.prev th,table.prev td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.prev th{background:var(--g-tint)}
pre.code{background:#f5f6f2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.8rem;overflow-x:auto;white-space:pre-wrap;margin:6px 0 10px}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(25,30,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g-ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.done-hero{text-align:center;padding:10px 0}
.done-hero .emoji{font-size:3rem}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin-bottom:4px}
.sent{border-bottom:1px solid var(--line);padding:10px 0}
.sent:last-child{border-bottom:0}
.dict-search{display:flex;gap:8px}
.dict-search input{flex:1;font-size:1.15rem}
.wcls{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fld{display:flex;gap:6px;align-items:flex-start}
.fld>*:first-child{flex:1}
.paste{flex:none;background:var(--g-tint);border:1.5px solid var(--g-tint2);border-radius:10px;min-height:44px;padding:0 10px;cursor:pointer;font-weight:700;font-size:.85rem}
.hint{font-size:.85rem;margin-top:4px}
.hint.ok{color:var(--g-dark)}.hint.no{color:var(--amber)}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 0 30px}
@media(max-width:480px){.prompt{font-size:1.6rem}.stats b{font-size:1.4rem}.hwrap img{height:48px}.rate button{min-height:58px;font-size:.92rem}}
</style>
</head>

<script>
/* ===================== Storage ===================== */
const KEY = 'fosbos-vocab-trainer-v1';
let storageOK = true;
let DB;

/* Demo list: lets anyone try every mode of the app from a fresh start.
   All fields are filled and every example sentence contains the word (gap mode). */
const DEMO_NAME = 'Demo – Social media';
const DEMO = {
  set: DEMO_NAME,
  words: [
    {en:'to scroll (v.)', de:'scrollen', def:'to move text or pictures on a screen up or down', ex:'I scrolled through my feed for over an hour last night.'},
    {en:'addictive (adj.)', de:'süchtig machend', def:'making you want to do or have it again and again', ex:'Many apps are designed to be addictive.'},
    {en:'screen time (n.)', de:'Bildschirmzeit', def:'the time you spend looking at a phone, TV or computer', ex:'My screen time was almost six hours yesterday.'},
    {en:'to rely on sth (phr. v.)', de:'sich auf etw. verlassen', def:'to need sth and trust it to help you', ex:'Teenagers rely on their phones for almost everything.'},
    {en:'privacy (n.)', de:'Privatsphäre, Datenschutz', def:'the right to keep your personal life and data to yourself', ex:'Check your privacy settings before you post photos.'},
    {en:'misleading (adj.)', de:'irreführend', def:'giving people a wrong idea or false impression', ex:'The advert for the energy drink was misleading.'},
    {en:'influencer (n.)', de:'Influencer(in)', def:'a person who earns money by promoting products online', ex:'The influencer got paid for every post about the shoes.'},
    {en:'to cope with sth (v.)', de:'mit etw. zurechtkommen, etw. bewältigen', def:'to deal successfully with a difficult situation', ex:'Many students find it hard to cope with exam stress.'},
    {en:'reliable / trustworthy (adj.)', de:'zuverlässig, vertrauenswürdig', def:'that you can believe and depend on', ex:'Is this website a reliable source for your presentation?'},
    {en:'peer pressure (n.)', de:'Gruppenzwang', def:'the feeling that you must do what your friends do', ex:'Peer pressure can make young people take silly risks.'},
    {en:'to raise awareness (of sth) (phr.)', de:'auf etw. aufmerksam machen, sensibilisieren', def:'to make more people know about a problem', ex:'The campaign aims to raise awareness of cyberbullying.'},
    {en:'consumer (n.)', de:'Verbraucher(in), Konsument(in)', def:'a person who buys things or uses services', ex:'Most consumers read online reviews before they buy.'}
  ]
};
function demoSet(){ return findSetByName(DEMO_NAME); }
function loadDemo(silent){
  importData(DEMO);
  const s = demoSet(); s.demo = true; s.active = true; delete s.test; delete s.testName;
  // fresh start: the demo always begins "as new"
  cards().filter(c => c.set === s.id).forEach(c => { Object.assign(c, {reps:0, s:null, d:null, due:null, last:null, lapses:0}); delete c.prep; });
  save();
  if(!silent){ toast('Demo list ready – 12 words'); go('today'); }
}
function demoTestTomorrow(){
  const s = demoSet(); if(!s) return;
  s.test = dayNum() + 1; s.testName = 'Demo test'; save();
  toast('Demo test set for tomorrow – see Test prep on the start page'); go('today');
}

function blank(){
  return {v:1, sets:{}, cards:{}, sentences:[], seq:0,
    settings:{newPerDay:10, roundSize:20, retention:0.9, mode:'smart'},
    daily:{day:0, newCount:0, reviews:0}, history:{}};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); DB = Object.assign(blank(), d); DB.settings = Object.assign(blank().settings, d.settings||{}); return; }
  }catch(e){ storageOK = false; }
  DB = blank();
  loadDemo(true);
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ storageOK = false; }
}

/* ===================== Helpers ===================== */
function dayNum(){ const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset()*60000)/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function touchDaily(){ const t = dayNum(); if(DB.daily.day !== t) DB.daily = {day:t, newCount:0, reviews:0}; }
function cards(){ return Object.values(DB.cards); }
function activeCards(){ return cards().filter(c => DB.sets[c.set] && DB.sets[c.set].active); }

/* ===================== FSRS-5 (default parameters) ===================== */
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY = -0.5, FACTOR = 19/81;
const clampD = d => Math.min(10, Math.max(1, d));
const initS = g => W[g-1];
const initD = g => clampD(W[4] - Math.exp(W[5]*(g-1)) + 1);
const retr = (t, s) => Math.pow(1 + FACTOR*t/s, DECAY);
function intervalFor(s){
  const r = DB.settings.retention;
  const i = s/FACTOR * (Math.pow(r, 1/DECAY) - 1);
  return Math.min(365, Math.max(1, Math.round(i)));
}
function nextD(d, g){ const d1 = d + (-W[6]*(g-3)) * (10-d)/9; return clampD(W[7]*initD(4) + (1-W[7])*d1); }
function sRecall(d, s, r, g){
  return s * (1 + Math.exp(W[8]) * (11-d) * Math.pow(s, -W[9]) * (Math.exp(W[10]*(1-r)) - 1) * (g===2?W[15]:1) * (g===4?W[16]:1));
}
function sForget(d, s, r){ return Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s+1, W[13]) - 1) * Math.exp(W[14]*(1-r))); }
function nextState(c, g){
  const t = dayNum(); let s, d;
  if(!c.reps){ s = initS(g); d = initD(g); }
  else{
    const el = Math.max(0, t - c.last), r = retr(el, c.s);
    if(el === 0) s = c.s * Math.exp(W[17]*(g-3+W[18]));
    else s = g===1 ? sForget(c.d, c.s, r) : sRecall(c.d, c.s, r, g);
    d = nextD(c.d, g);
  }
  s = Math.max(0.1, s);
  return {s, d, last:t, due: t + (g===1 ? 1 : intervalFor(s))};
}
function applyRating(c, g){
  const n = nextState(c, g);
  if(g===1 && c.reps) c.lapses = (c.lapses||0) + 1;
  Object.assign(c, n); c.reps = (c.reps||0) + 1; capForTest(c);
  touchDaily(); DB.daily.reviews++;
  DB.history[n.last] = (DB.history[n.last]||0) + 1;
  save();
}
/* Deadline: if the next review would come after the test and recall on test day
   is predicted below the target, review the day before the test instead. */
function capForTest(c){
  const s = DB.sets[c.set], t = dayNum();
  if(!s || s.test == null || s.test <= t || !c.reps) return;
  const T = s.test;
  if(c.due >= T && retr(T - c.last, c.s) < DB.settings.retention) c.due = Math.max(t+1, T-1);
}
/* When a test date is set: words that would not be reviewed before the test are
   spread over the last week before it (no single overloaded day). */
function retarget(setId){
  const s = DB.sets[setId], t = dayNum();
  if(!s || s.test == null || s.test <= t) return;
  const T = s.test, lo = Math.max(t, T-7);
  cards().filter(c => c.set===setId && c.reps).forEach(c => {
    if(c.due >= T && retr(T - c.last, c.s) < DB.settings.retention) c.due = lo + Math.floor(Math.random()*(T-lo));
  });
}
function ivlLabel(days){ return days<=1 ? '1 day' : days<30 ? days+' days' : days<365 ? Math.round(days/30)+' mo' : '1 yr'; }

/* ===================== Word helpers ===================== */
function wordClass(en){ const m = String(en).match(/\(([^)]*)\)/); return m ? m[1] : ''; }
function headword(en){ return String(en).replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); }
function norm(x){
  return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\([^)]*\)/g,' ')
    .replace(/\b(sth|sb|something|somebody|someone)\b/g,' ')
    .replace(/[.,!?;:"“”]/g,' ').replace(/\s+/g,' ').trim().replace(/^to /,'');
}
function variants(en){ return [...new Set(headword(en).split(/\s*[\/;,]\s*/).map(norm).filter(Boolean))]; }
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function grade(input, targets){
  const n = norm(input); if(!n) return 'wrong';
  if(targets.includes(n)) return 'ok';
  for(const t of targets){ const tol = t.length<=4 ? 0 : t.length<=8 ? 1 : 2; if(tol && lev(n,t) <= tol) return 'typo'; }
  return 'wrong';
}
function gapInfo(c){
  if(!c.ex) return null;
  for(const v of variants(c.en)){
    let stem = v;
    if(stem.length>4 && /[ey]$/.test(stem)) stem = stem.slice(0,-1);
    const pat = '\\b' + stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+') + "[\\w'’-]*";
    const m = c.ex.match(new RegExp(pat,'i'));
    if(m) return {before:c.ex.slice(0,m.index), answer:m[0], after:c.ex.slice(m.index+m[0].length), base:v};
  }
  return null;
}
function exHTML(c){
  const g = gapInfo(c);
  if(!g) return esc(c.ex);
  return esc(g.before) + '<b>' + esc(g.answer) + '</b>' + esc(g.after);
}
function stage(c){ if(!c.reps) return 'new'; if(c.s < 7) return 'learning'; if(c.s < 30) return 'familiar'; return 'mastered'; }
function stageTag(c){ const s = stage(c); return `<span class="tag st-${s}">${s}</span>`; }
function dueText(c){ if(!c.reps) return 'not started'; const d = c.due - dayNum(); return d<=0 ? 'due today' : d===1 ? 'tomorrow' : 'in '+d+' days'; }
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  try{ const u = new SpeechSynthesisUtterance(headword(text).replace(/\bsth\b/g,'something').replace(/\bsb\b/g,'somebody'));
    u.lang='en-GB'; u.rate=.92; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function speakBtn(c){ return canSpeak ? `<button class="speak" title="Listen" onclick="speak(DB.cards['${c.id}'].en)">🔊</button>` : ''; }

/* ===================== Import ===================== */
const ALIASES = {
  en:['en','english','englisch','word','wort','vocab','vocabulary','term','vokabel'],
  de:['de','german','deutsch','translation','übersetzung','bedeutung (dt.)'],
  def:['def','definition','explanation','meaning','erklärung','english explanation'],
  ex:['ex','example','beispiel','sentence','example sentence','beispielsatz','context'],
  src:['src','source','quelle','ref','paragraph','absatz']
};
function fieldOf(name){ const n = String(name).toLowerCase().trim(); for(const k in ALIASES) if(ALIASES[k].includes(n)) return k; return null; }
function normWord(o){
  const w = {};
  for(const k in o){ const f = fieldOf(k); if(f && o[k] != null && String(o[k]).trim()) w[f] = String(o[k]).trim(); }
  return w.en ? w : null;
}
function findSetByName(name){ return Object.values(DB.sets).find(s => s.name.toLowerCase() === name.toLowerCase()); }
function importData(data, fallbackName){
  // returns {added, updated, sets:[names]}
  let groups = [];
  if(Array.isArray(data)){
    if(data.length && data[0] && (data[0].words || data[0].set)) groups = data;
    else groups = [{set:fallbackName, words:data}];
  } else if(data && Array.isArray(data.sets)) groups = data.sets;
  else if(data && Array.isArray(data.words)) groups = [data];
  else throw new Error('No words found.');
  let added = 0, updated = 0; const names = []; const retargetLater = [];
  for(const g of groups){
    const name = String(g.set || g.name || fallbackName || 'My words').trim();
    let set = findSetByName(name);
    if(!set){ set = {id:uid(), name, active:true, created:Date.now()}; DB.sets[set.id] = set; }
    if(g.test){ const d = isoToDay(g.test); if(d != null){ set.test = d; if(g.testName) set.testName = String(g.testName); retargetLater.push(set.id); } }
    names.push(name);
    for(const raw of (g.words||[])){
      const w = normWord(raw); if(!w) continue;
      const existing = cards().find(c => c.set===set.id && norm(c.en)===norm(w.en));
      if(existing){ Object.assign(existing, w); updated++; }
      else{ const id = uid(); DB.cards[id] = Object.assign({id, set:set.id, n:++DB.seq, reps:0}, w); added++; }
    }
  }
  retargetLater.forEach(retarget);
  save();
  return {added, updated, sets:[...new Set(names)]};
}
function parseTable(text){
  let lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^\|?\s*:?-{2,}/.test(l));
  if(!lines.length) return [];
  const sample = lines.slice(0,5).join('\n');
  let sep;
  if(sample.includes('\t')) sep = '\t';
  else if(sample.includes('|')) sep = '|';
  else if(sample.includes(';')) sep = ';';
  else if(/ [–—-] /.test(sample)) sep = / [–—-] /;
  else if(sample.includes(' = ')) sep = ' = ';
  else sep = ',';
  const split = l => { let s = l; if(sep==='|') s = s.replace(/^\|/,'').replace(/\|$/,''); return s.split(sep).map(x => x.trim()); };
  let order = ['en','de','def','ex','src'];
  const head = split(lines[0]).map(fieldOf);
  if(head.filter(Boolean).length >= 2 && head.includes('en')){ order = head; lines = lines.slice(1); }
  return lines.map(l => { const cells = split(l); const o = {}; order.forEach((f,i) => { if(f && cells[i]) o[f] = cells[i]; }); return o; }).filter(o => o.en);
}
function parseInput(text, name){
  const t = text.trim(); if(!t) throw new Error('Paste some words first.');
  if(/^[\[{]/.test(t)){
    let data; try{ data = JSON.parse(t); }catch(e){ throw new Error('This looks like a code, but it is incomplete. Copy it again.'); }
    return data;
  }
  return {set:name, words:parseTable(t)};
}
function countWords(data){
  if(Array.isArray(data)) return data[0] && data[0].words ? data.reduce((a,g)=>a+(g.words||[]).length,0) : data.length;
  if(data.sets) return data.sets.reduce((a,g)=>a+(g.words||[]).length,0);
  return (data.words||[]).length;
}
function previewWords(data){
  if(Array.isArray(data)) return data[0] && data[0].words ? data.flatMap(g=>g.words) : data;
  if(data.sets) return data.sets.flatMap(g=>g.words||[]);
  return data.words || [];
}
function exportSet(setId){
  const s = DB.sets[setId];
  const words = cards().filter(c => c.set===setId).sort((a,b)=>a.n-b.n).map(c => { const o = {en:c.en}; ['de','def','ex','src'].forEach(k => { if(c[k]) o[k]=c[k]; }); return o; });
  const o = {set:s.name}; if(s.test != null){ o.test = dayToIso(s.test); if(s.testName) o.testName = s.testName; } o.words = words;
  return JSON.stringify(o);
}

function dueCount(){ const t = dayNum(); return activeCards().filter(c => c.reps && c.due <= t).length; }
const BRAKE_HALF = 60, BRAKE_STOP = 100, URGENT_DAYS = 4, URGENT_MAX = 25;
function isoToDay(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Math.floor(Date.UTC(+m[1], +m[2]-1, +m[3]) / 864e5) : null; }
function dayToIso(d){ return new Date(d*864e5).toISOString().slice(0,10); }
function fmtDay(d){ return new Date(d*864e5).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'}); }
function inDays(d){ const k = d - dayNum(); return k===0 ? 'today' : k===1 ? 'tomorrow' : 'in '+k+' days'; }
function lastPractice(){ const ks = Object.keys(DB.history).map(Number).filter(k => DB.history[k] > 0); return ks.length ? Math.max(...ks) : null; }
function upcomingTests(){ const t = dayNum(); return Object.values(DB.sets).filter(s => s.active && s.test != null && s.test >= t).sort((a,b) => a.test - b.test); }
/* All lists with the same test date form one test (e.g. 10 lists for a Schulaufgabe). */
function testGroups(){
  const g = {};
  upcomingTests().forEach(s => { const x = g[s.test] = g[s.test] || {test:s.test, sets:[], name:''}; x.sets.push(s); if(!x.name && s.testName) x.name = s.testName; });
  return Object.values(g).sort((a,b) => a.test-b.test).map(x => { x.name = x.name || (x.sets.length===1 ? x.sets[0].name : 'Test'); x.key = 'g'+x.test; return x; });
}
function groupCards(day){ return cards().filter(c => DB.sets[c.set] && DB.sets[c.set].test === day); }
function prepWindow(day){ return groupCards(day).length > 40 ? 7 : 3; }
function isUrgent(set){
  const t = dayNum(); if(!set || set.test == null || set.test < t) return false;
  const unstarted = groupCards(set.test).filter(c => !c.reps).length;
  return set.test - t <= Math.max(URGENT_DAYS, Math.ceil(unstarted/20) + 2);

/* New words for today: words of sets with a test soon come first and bypass the daily limit;
   the rest is limited by "new words per day" and braked when many reviews are due. */
function newPlan(){
  touchDaily();
  const t = dayNum(), due = dueCount();
  const prio = c => { const s = DB.sets[c.set]; return (s.test != null && s.test >= t) ? s.test : 1e9; };
  const fresh = activeCards().filter(c => !c.reps).sort((a,b) => prio(a)-prio(b) || a.n-b.n);
  const urgent = fresh.filter(c => isUrgent(DB.sets[c.set])).slice(0, URGENT_MAX);
  const factor = due > BRAKE_STOP ? 0 : due > BRAKE_HALF ? 0.5 : 1;
  const normalLeft = Math.max(0, DB.settings.newPerDay - DB.daily.newCount);
  const quota = Math.max(0, Math.floor(DB.settings.newPerDay*factor) - DB.daily.newCount);
  const rest = fresh.filter(c => !urgent.includes(c)).slice(0, Math.max(0, quota - urgent.length));
  const waiting = fresh.length - urgent.length;
  return {list:[...urgent, ...rest], urgent:urgent.length, braked: factor < 1 && quota < normalLeft && waiting > rest.length, due, quota};
}

/* ===================== Session ===================== */
function startSession(setId){
  touchDaily();
  const t = dayNum();
  let reviews, news;
  const left = Math.max(0, DB.settings.newPerDay - DB.daily.newCount);
  if(setId){
    const inSet = cards().filter(c => c.set===setId);
    reviews = shuffle(inSet.filter(c => c.reps)).slice(0, 25);
    news = inSet.filter(c => !c.reps).sort((a,b)=>a.n-b.n).slice(0, Math.max(left, 5));
  } else {
    const act = activeCards();
    // most-at-risk first, shuffled within each round so sets stay mixed
    const rv = act.filter(c => c.reps && c.due <= t).sort((a,b) => retr(t-a.last,a.s) - retr(t-b.last,b.s));
    const rs = DB.settings.roundSize; reviews = [];
    for(let k=0;k<rv.length;k+=rs) reviews.push(...shuffle(rv.slice(k,k+rs)));
    news = newPlan().list;
  }
  if(!reviews.length && !news.length){ toast('Nothing to practise here yet.'); return; }
  const seq = []; let ri = 0;
  const per = news.length ? Math.min(2, Math.floor(reviews.length/(news.length+1))) : 0; // new words early, so they are met even if the learner stops after round 1
  for(const c of news){ for(let k=0;k<per && ri<reviews.length;k++) seq.push({id:reviews[ri++].id, kind:'test'}); seq.push({id:c.id, kind:'intro'}); }
  while(ri < reviews.length) seq.push({id:reviews[ri++].id, kind:'test'});
  for(const c of news){ const idx = seq.findIndex(x => x.id===c.id && x.kind==='intro'); seq.splice(Math.min(seq.length, idx+4), 0, {id:c.id, kind:'test'}); }
  SESSION = {q:seq, i:0, rated:{}, counts:{1:0,2:0,3:0,4:0}, newCount:0, answered:false, inRound:0, round:1, pause:false, roundStart:{1:0,2:0,3:0,4:0}};
  VIEW = 'session'; render(); window.scrollTo(0,0);
}
function canMode(c, m){
  if(m==='mc') return !!mcOptions(c);
  if(m==='def') return !!c.def;
  if(m==='gap') return !!gapInfo(c);
  if(m==='type') return !!c.de;
  return true;
}
function pickMode(c){
  // a mode chosen on the start page applies to every card, new words included
  const f = DB.settings.mode;
  if(f !== 'smart') return canMode(c,f) ? f : (canMode(c,'type') ? 'type' : 'flash');
  if(!c.reps) return canMode(c,'mc') ? 'mc' : 'flash';
  const s = c.s || 0; let o;
  if(s < 4) o = ['flash','flash','mc'];
  else if(s < 12) o = ['type','type','def','flash'];
  else o = ['gap','gap','type','def','def','sentence'];
  o = o.filter(m => canMode(c,m)); if(!o.length) o = ['flash'];
  return pick(o);
}
const _mcCache = {};
function mcOptions(c){
  if(_mcCache[c.id] && _mcCache[c.id].v === c.de) return _mcCache[c.id].o;
  if(!c.de) return null;
  const pool = cards().filter(x => x.id!==c.id && x.de);
  const same = shuffle(pool.filter(x => x.set===c.set)), other = shuffle(pool.filter(x => x.set!==c.set));
  const seen = new Set([norm(c.de)]), picks = [];
  for(const x of [...same, ...other]){ if(picks.length>=3) break; const k = norm(x.de); if(seen.has(k)) continue; seen.add(k); picks.push(x.de); }
  const o = picks.length >= 2 ? shuffle([c.de, ...picks]) : null;
  _mcCache[c.id] = {v:c.de, o}; return o;
}
const MODE_LABEL = {flash:'Flashcard', mc:'Multiple choice', type:'Type the English word', def:'Definition → word', gap:'Complete the sentence', sentence:'Write your own sentence'};

function cur(){ return SESSION.q[SESSION.i]; }
function viewSession(){
  if(!SESSION){ go('today'); return; }
  if(SESSION.i >= SESSION.q.length){ viewDone(); return; }
  if(SESSION.pause){ viewRound(); return; }
  const it = cur(), c = DB.cards[it.id];
  if(!c){ SESSION.i++; viewSession(); return; }
  const pct = Math.round(SESSION.i / SESSION.q.length * 100);
  let body = '';
  if(it.kind === 'intro') body = introHTML(c);
  else{
    if(!it.mode){
      const fm = DB.settings.mode;
      it.mode = it.kind==='practice'
        ? (fm !== 'smart' && fm !== 'sentence' && canMode(c,fm) ? fm : (canMode(c,'mc') && (c.reps||0) <= 1 ? 'mc' : 'flash'))
        : pickMode(c);
      if(it.mode==='flash') it.dir = (!c.reps || (c.s||0) < 4 || it.kind==='practice') ? 'en' : pick(['en','de']);
      if(it.mode==='mc') it.opts = shuffle(mcOptions(c));
    }
    if(it.mode==='mc' && !it.opts){ const o = mcOptions(c); if(o) it.opts = shuffle(o); else it.mode = 'flash'; }
    if(it.mode==='flash' && !it.dir) it.dir = 'en';
    body = ({flash:flashHTML, mc:mcHTML, type:typeHTML, def:typeHTML, gap:gapHTML, sentence:sentenceHTML})[it.mode](c, it);
  }
  app.innerHTML = `
    <div class="sess-top">
      <button class="btn ghost sm" onclick="endSession()">✕ End</button>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <span class="small muted">${SESSION.i}/${SESSION.q.length}</span>
    </div>
    <div class="qcard">${body}</div>`;
  const inp = document.getElementById('ans'); if(inp && !SESSION.answered) inp.focus({preventScroll:true});
}
function endSession(){
  if(SESSION.type==='prep'){ SESSION.q = SESSION.q.slice(0, SESSION.i); render(); return; }
  const done = Object.keys(SESSION.rated).length;
  if(done && SESSION.i < SESSION.q.length){ SESSION.q = SESSION.q.slice(0, SESSION.i); }
  if(!done){ go('today'); return; }
  render();
}

    : it.kind==='prep' ? (it.check ? '🎯 Check · ' : '🎯 Test prep · ') + MODE_LABEL[it.mode] : MODE_LABEL[it.mode];
  return `<div class="mode">${lab}${extra||''}</div>`;

function hintFor(c){ const v = variants(c.en)[0] || ''; return v.split(' ').map(w => w[0] + w.slice(1).replace(/[a-z'’-]/gi,'_')).join('  '); }

function checkTyped(){

    const r1 = grade(v, [norm(g.answer)]);
    if(r1==='ok') it.result = 'ok';
    else if(grade(v, variants(c.en))==='ok'){ it.result = 'ok'; it.note = `Right word! In this sentence the form is “${g.answer}”.`; }

  } else it.result = grade(v, variants(c.en));

function giveUp(){ const it = cur(); it.typed = ''; it.result = 'wrong'; finishAuto(it, DB.cards[it.id]); }
/* --- gap --- */
function gapHTML(c, it){

/* --- own sentence --- */
function sentenceHTML(c, it){

function skipSentence(){ const it = cur(); it.result='wrong'; if(it.kind==='test' && !SESSION.rated[it.id]){ applyRating(DB.cards[it.id],1); SESSION.rated[it.id]=1; SESSION.counts[1]++; } nextItem(); }
function saveSentence(){
  const it = cur(), c = DB.cards[it.id], v = document.getElementById('ans').value.trim();
  if(v.split(/\s+/).length < 4){ toast('Write a full sentence (at least 4 words).'); return; }
  const stems = variants(c.en).map(x => x.length>4 ? x.slice(0,-1) : x);
  const low = v.toLowerCase();
  if(!stems.some(s => low.includes(s.split(' ')[0]))){ toast(`Use the word “${headword(c.en)}” in your sentence.`); return; }
  it.typed = v;
  DB.sentences.unshift({id:uid(), card:c.id, word:headword(c.en), text:v, day:dayNum()});

/* --- feedback + rating --- */
function feedbackHTML(c, it){
  const r = it.result;
  const cls = r==='ok' ? 'ok' : (r==='typo'||r==='hint') ? 'mid' : 'bad';
  const title = r==='ok' ? pick(['Correct! ✓','Well done! ✓','Yes! ✓']) : r==='typo' ? 'Almost – check the spelling' : r==='hint' ? 'Correct (with hint)' : (it.mode==='mc' ? 'Not quite' : 'The answer is:');

}
function finishAuto(it, c){
  SESSION.answered = true;
  const g = it.result==='ok' ? 3 : (it.result==='typo'||it.result==='hint') ? 2 : 1;

function afterAnswer(it, c, g){
  if(it.kind==='prep'){ prepAnswer(it, c, g); return; }
  if(it.kind==='test' && !SESSION.rated[c.id]){

  }
  if(g===1){
    const tries = (it.tries||0) + 1;
    if(tries <= 2) SESSION.q.splice(Math.min(SESSION.q.length, SESSION.i+4), 0, {id:c.id, kind:'practice', tries});
  }
  if(it.mode==='flash'){ nextItem(); return; }
  viewSession();
  const nb = document.getElementById('nextbtn'); if(nb) nb.focus({preventScroll:true});
}
function rate(g){ const it = cur(); afterAnswer(it, DB.cards[it.id], g); }
function nextItem(){ advance(); }
document.addEventListener('keydown', e => {

  if(it.mode==='mc' && !SESSION.answered && ['1','2','3','4'].includes(e.key) && it.opts && it.opts[+e.key-1]) mcAnswer(+e.key-1);

function viewDone(){

  const n = Object.keys(SESSION.rated).length, ct = SESSION.counts;

    <div class="stats">
      <div class="stat"><b>${ct[3]+ct[4]}</b><span>knew it</span></div>
      <div class="stat"><b>${ct[2]}</b><span>hard</span></div>
      <div class="stat"><b>${ct[1]}</b><span>again</span></div>
    </div>
    <p>${stillDue ? `Still open today: <b>${stillDue}</b> cards.` : tomorrow ? `Tomorrow: <b>${tomorrow}</b> words are waiting for you.` : 'See you tomorrow!'} Streak: <b>${streak()} day${streak()===1?'':'s'}</b>.</p>
    <div class="actions">${stillDue ? `<button class="btn ghost big" onclick="startSession()">One more round</button>` : ''}<button class="btn primary big" onclick="go('today')">Back to start</button></div>

/* ===================== Test prep (Ausfrage) =====================
   Successive relearning: 1) learn every word to criterion (2 correct recalls in a row,
   the last one productive: type the English word); 2) after >= 3 hours (e.g. evening,
   next morning) a check round: each word is recalled once; missed words are relearned
   to criterion. Only a word's first answer of the day goes into FSRS, so the drill does
   not distort long-term scheduling. */
const PREP_GAP_H = 3;
function prepKey(set){ return set.test != null ? set.test : 'open'; }
function prepOf(c){ const k = prepKey(DB.sets[c.set]); if(!c.prep || c.prep.test !== k) c.prep = {test:k, n:0, t:0}; return c.prep; }
function prepScope(key){
  key = String(key);
  if(key[0]==='g'){ const d = +key.slice(1), g = testGroups().find(x => x.test===d); return {key, name: g ? g.name : 'Test', test:d, lists: g ? g.sets.length : 0, list: groupCards(d)}; }
  const s = DB.sets[key]; return {key, name:s.name, test:s.test, lists:1, list:cards().filter(c => c.set===key)};
}
function cardDay(ms){ return Math.floor((ms - new Date(ms).getTimezoneOffset()*6e4)/864e5); }
function prepDue(c){
  const p = prepOf(c); if(p.n === 0) return 'learn';
  return (Date.now() - p.t >= PREP_GAP_H*36e5 || dayNum() > cardDay(p.t)) ? 'check' : null;
}
function prepStatus(key){
  const list = prepScope(key).list, gap = PREP_GAP_H*36e5;
  let learned = 0, checked = 0, ready = 0, next = null;
  list.forEach(c => { const p = prepOf(c), d = prepDue(c);
    if(p.n >= 1) learned++; if(p.n >= 2) checked++;
    if(d) ready++; else { const at = p.t + gap; if(next == null || at < next) next = at; } });
  return {total:list.length, learned, checked, ready, next};
}
function prepLearnMode(c, streak){
  if(streak >= 1) return canMode(c,'type') ? 'type' : 'def';
  return (c.reps||0) <= 1 && mcOptions(c) ? 'mc' : 'flash';
}
function startPrep(key){
  touchDaily();
  const sc = prepScope(key), t = dayNum();
  const weak = (a,b) => (a.reps ? retr(t-a.last, a.s) : -1) - (b.reps ? retr(t-b.last, b.s) : -1);
  const learn = sc.list.filter(c => prepDue(c)==='learn').sort(weak);
  const check = sc.list.filter(c => prepDue(c)==='check').sort(weak);
  if(!learn.length && !check.length){ const st = prepStatus(key); toast(st.next ? 'Next check round from ' + new Date(st.next).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Nothing to do.'); return; }
  const rs = DB.settings.roundSize, blocks = arr => { const o = []; for(let k=0;k<arr.length;k+=rs) o.push(...shuffle(arr.slice(k,k+rs))); return o; };
  const seq = blocks(check).map(c => ({id:c.id, kind:'prep', check:true, mode: canMode(c,'type') ? 'type' : 'def'}));
  const streak = {};
  for(const c of blocks(learn)){
    if(!c.reps){ seq.push({id:c.id, kind:'intro'}); streak[c.id] = 0; }
    else { streak[c.id] = (c.s||0) >= 7 ? 1 : 0; seq.push({id:c.id, kind:'prep', mode: prepLearnMode(c, streak[c.id])}); }
  }
  for(const c of learn.filter(c => !c.reps)){ const idx = seq.findIndex(x => x.id===c.id && x.kind==='intro'); seq.splice(Math.min(seq.length, idx+3), 0, {id:c.id, kind:'prep', mode: prepLearnMode(c, 0)}); }
  SESSION = {type:'prep', key:sc.key, q:seq, i:0, rated:{}, counts:{1:0,2:0,3:0,4:0}, newCount:0, answered:false, inRound:0, round:1, pause:false, roundStart:{1:0,2:0,3:0,4:0}, streak, stats:{ok:0, all:0}, reached:0, checkOk:0, checkAll:check.length};
  VIEW = 'session'; render(); window.scrollTo(0,0);
}
function prepAnswer(it, c, g){
  // FSRS: only the first answer of the day counts
  if(!SESSION.rated[c.id] && c.last !== dayNum()){ applyRating(c, g); SESSION.counts[g]++; }
  SESSION.rated[c.id] = SESSION.rated[c.id] || g;
  const p = prepOf(c), st = SESSION.streak;
  SESSION.stats.all++; if(g >= 3) SESSION.stats.ok++;
  const requeue = mode => { const gap = 3 + Math.floor(Math.random()*3); SESSION.q.splice(Math.min(SESSION.q.length, SESSION.i+gap), 0, {id:c.id, kind:'prep', mode}); };
  if(it.check){
    if(g >= 3){ p.n++; p.t = Date.now(); SESSION.checkOk++; }
    else { st[c.id] = g===2 ? 1 : 0; requeue(prepLearnMode(c, st[c.id])); }
  } else {
    const productive = ['type','def','gap'].includes(it.mode);
    if(g >= 3){
      st[c.id] = (st[c.id]||0) + 1;
      if(st[c.id] >= 2 && productive){ p.n = Math.max(1, p.n); p.t = Date.now(); SESSION.reached++; }
      else requeue(prepLearnMode(c, st[c.id]));
    } else { st[c.id] = g===2 ? Math.max(1, st[c.id]||0) : 0; requeue(prepLearnMode(c, st[c.id])); }
  }
  save();
  if(it.mode==='flash'){ nextItem(); return; }
  viewSession();
  const nb = document.getElementById('nextbtn'); if(nb) nb.focus({preventScroll:true});
}
function prepPanel(key){
  const sc = prepScope(key), st = prepStatus(key);
  const nextTxt = st.next ? new Date(st.next).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const step1 = st.learned >= st.total, step2 = st.checked >= st.total;
  const t0 = dayNum(), rdy = sc.list.filter(c => prepDue(c));
  const mins = Math.max(1, Math.round(rdy.reduce((m,c) => m + (prepDue(c)==='check' ? 0.2 : !c.reps ? 0.8 : (c.s||0) >= 7 ? 0.25 : 0.5), 0)));
  const rs = DB.settings.roundSize;
  return `<div class="card tint">
    <div class="spread"><h3 style="margin:0">🎯 Test prep: ${esc(sc.name)}</h3>${sc.test != null ? `<span class="small"><b>${fmtDay(sc.test)}</b> (${inDays(sc.test)})</span>` : ''}</div>
    ${sc.lists > 1 ? `<p class="small muted" style="margin:4px 0 0">${sc.lists} lists · ${st.total} words</p>` : ''}
    <ul class="tips small" style="margin-top:8px;list-style:none;padding-left:0">
      <li>${step1 ? '✅' : '⬜'} <b>Learn</b> every word until you can type it (new or weak words: twice in a row): <b>${st.learned}/${st.total}</b></li>
      <li>${step2 ? '✅' : '⬜'} <b>Check</b> at least 3 hours later – each word once, only mistakes are practised again: <b>${st.checked}/${st.total}</b></li>
    </ul>
    ${st.ready ? `<button class="btn primary block" onclick="startPrep('${sc.key}')">${st.learned < st.total ? 'Learn' : 'Check'} now · ${st.ready > rs ? `round of ${rs} (${st.ready} words open, ≈ ${mins} min in total)` : `${st.ready} word${st.ready===1?'':'s'} (≈ ${mins} min)`}</button>`
      : `<p class="small" style="margin:0">${step2 ? 'Ready for the test 💪 – one more check right before class does not hurt.' : `Next check from <b>${nextTxt}</b>. Sleep helps your memory!`}</p>`}
    ${sc.lists > 1 && sc.test - dayNum() > 3 ? `<p class="small muted" style="margin:8px 0 0">Tip: spread it out – e.g. learn a few lists per day this week, then check everything 1–2 days before the test.</p>` : ''}
  </div>`;
}
function viewPrepDone(){
  const S = SESSION, sc = prepScope(S.key), st = prepStatus(S.key);
  const nextTxt = st.next ? new Date(st.next).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  app.innerHTML = `<div class="qcard done-hero">
    <div class="emoji">🎯</div>
    <h2>Test prep: ${esc(sc.name)}</h2>
    <p class="muted">${S.stats.all} answers · ${S.stats.all ? Math.round(S.stats.ok/S.stats.all*100) : 0} % correct${S.checkAll ? ` · check: ${S.checkOk} remembered at first try` : ''}</p>
    <div class="stats">
      <div class="stat"><b>${st.learned}/${st.total}</b><span>learned</span></div>
      <div class="stat"><b>${st.checked}/${st.total}</b><span>checked later</span></div>
      <div class="stat"><b>${st.total - st.learned}</b><span>still to learn</span></div>
    </div>
    <p>${st.learned < st.total ? 'Some words are not learned yet – continue when you are ready.'
      : st.checked < st.total ? `Great! Now take a break. <b>Check round from ${nextTxt}</b> – e.g. this evening or tomorrow morning before class.`
      : 'Ready for the test 💪'}</p>
    <p class="small muted">After the test the words stay in your daily practice, so you will still know them for the exam.</p>
    <div class="actions">${st.ready && st.learned < st.total ? `<button class="btn ghost big" onclick="startPrep('${S.key}')">Continue</button>` : ''}<button class="btn primary big" onclick="go('today')">Back to start</button></div>
  </div>`;
}

/* ===================== My words ===================== */
let wordSearch = '';
function viewWords(){
  const sets = Object.values(DB.sets).sort((a,b)=>a.created-b.created);
  const q = norm(wordSearch);
  app.innerHTML = `
    <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">My words</h2>

/* ===================== Dictionary (Oxford Learner's Dictionary + add to a list) ===================== */
const OALD = 'https://www.oxfordlearnersdictionaries.com/search/english/?q=';
const WCLS = [['n.','noun'],['v.','verb'],['adj.','adjective'],['adv.','adverb'],['phr. v.','phrasal verb'],['idiom','idiom'],['phr.','phrase']];
const DICT_SET = 'My dictionary words';
function lookupTerm(x){ return headword(x).replace(/\b(sth|sb|something|somebody|someone)\b/gi,' ').replace(/^to\s+/i,'').replace(/[\/;].*$/,'').replace(/\s+/g,' ').trim(); }
function oaldURL(x){ return OALD + encodeURIComponent(lookupTerm(x)); }
function dictState(){ if(!DB.dict) DB.dict = {draft:{q:'',en:'',cls:'',de:'',def:'',ex:''}, set:null, recent:[]}; return DB.dict; }
function dictSave(){ const D = dictState(); ['q','en','de','def','ex'].forEach(k => { const el = document.getElementById('d-'+k); if(el) D.draft[k] = el.value; }); save(); }
function dictLookup(){
  const D = dictState(), q = document.getElementById('d-q').value.trim();
  if(!q){ toast('Type a word first.'); return false; }
  // the searched word goes into the form (unless the student already started a different word)
  if(!D.draft.en || norm(D.draft.en) === norm(D.draft.q)) D.draft.en = q;
  D.draft.q = q; save();
  const a = document.getElementById('d-go'); a.href = oaldURL(q);
  setTimeout(viewDict, 300);
  return true;
}
function dictClass(k){ const D = dictState(); dictSave(); D.draft.cls = D.draft.cls === k ? '' : k; save(); viewDict(); }
async function dictPaste(k){
  try{ const t = (await navigator.clipboard.readText()).trim(); if(!t){ toast('Nothing to paste – copy text in the dictionary first.'); return; }
    const el = document.getElementById('d-'+k); el.value = t; dictSave(); dictHint(); }
  catch(e){ toast('Press and hold in the box, then tap “Paste”.'); document.getElementById('d-'+k).focus(); }
}
function dictEN(){ const D = dictState(); let en = (document.getElementById('d-en')?.value ?? D.draft.en).trim().replace(/\s*\([^)]*\)\s*$/,''); if(en && (D.draft.cls==='v.' || D.draft.cls==='phr. v.') && !/^to\s/i.test(en)) en = 'to ' + en; if(en && D.draft.cls) en += ' (' + D.draft.cls + ')'; return en; }
function dictHint(){
  const el = document.getElementById('d-exhint'); if(!el) return;
  const ex = document.getElementById('d-ex').value.trim(), en = dictEN();
  if(!ex || !en){ el.textContent = ''; el.className = 'hint'; return; }
  const ok = !!gapInfo({en, ex});
  el.className = 'hint ' + (ok ? 'ok' : 'no');
  el.textContent = ok ? '✓ The sentence contains the word – the app can make gap sentences from it.' : '⚠ The word is not in the sentence (or has a different form). Gap sentences won’t work for this word.';
}
function dictSetChange(sel){
  if(sel.value === '__new'){ const n = prompt('Name of the new list:', ''); if(n && n.trim()){ const name = n.trim(); let s = findSetByName(name); if(!s){ s = {id:uid(), name, active:true, created:Date.now()}; DB.sets[s.id] = s; } dictState().set = s.id; } dictSave(); viewDict(); return; }
  dictState().set = sel.value; save();
}
function dictAdd(){
  dictSave();
  const D = dictState(), d = D.draft, en = dictEN();
  if(!en){ toast('Enter the English word.'); return; }
  if(!d.de.trim() && !d.def.trim()){ toast('Add a German meaning or an English explanation.'); return; }
  let set = D.set && DB.sets[D.set];
  if(!set){ set = findSetByName(DICT_SET) || (DB.sets[(()=>{ const id = uid(); DB.sets[id] = {id, name:DICT_SET, active:true, created:Date.now()}; return id; })()]); D.set = set.id; }
  const dup = cards().find(c => c.set===set.id && norm(c.en)===norm(en));
  const w = {en, de:d.de.trim(), def:d.def.trim(), ex:d.ex.trim(), src:'OALD'};
  Object.keys(w).forEach(k => { if(!w[k]) delete w[k]; });
  let id;
  if(dup){ Object.assign(dup, w); id = dup.id; }
  else{ id = uid(); DB.cards[id] = Object.assign({id, set:set.id, n:++DB.seq, reps:0}, w); }
  D.recent = [id, ...D.recent.filter(x => x !== id)].slice(0, 8);
  D.draft = {q:'', en:'', cls:'', de:'', def:'', ex:''};
  save(); toast(dup ? `Updated in “${set.name}”` : `Added to “${set.name}”`); viewDict();
  document.getElementById('d-q').focus();
}
function dictClear(){ dictState().draft = {q:'', en:'', cls:'', de:'', def:'', ex:''}; save(); viewDict(); }
function viewDict(){
  const D = dictState(), d = D.draft;
  const sets = Object.values(DB.sets).filter(s => !s.demo).sort((a,b)=>a.created-b.created);
  if(D.set && !DB.sets[D.set]) D.set = null;
  const cur = D.set || (findSetByName(DICT_SET)||{}).id || '';
  const recent = D.recent.map(id => DB.cards[id]).filter(Boolean);
  const fld = (k, label, ph, ta, paste) => `<label class="f">${label}</label><div class="fld">${ta
      ? `<textarea class="prose" id="d-${k}" style="min-height:64px" placeholder="${ph}" oninput="dictSave();dictHint()">${esc(d[k])}</textarea>`
      : `<input id="d-${k}" type="text" placeholder="${ph}" value="${esc(d[k])}" oninput="dictSave();dictHint()" autocapitalize="off" autocorrect="off">`}${paste ? `<button class="paste" onclick="dictPaste('${k}')" title="Paste">📋 Paste</button>` : ''}</div>`;
  app.innerHTML = `
    <div class="card tint">
      <h2>📖 Dictionary</h2>
      <p class="small muted" style="margin-top:-4px">Look up a word in the <b>Oxford Learner’s Dictionary</b>. Copy what you need, come back here and add the word to one of your lists.</p>
      <div class="dict-search">
        <input id="d-q" type="search" placeholder="e.g. binge-watch, revenue, take a toll" value="${esc(d.q)}" autocapitalize="off" autocorrect="off" enterkeyhint="search"
          onkeydown="if(event.key==='Enter'){event.preventDefault();if(dictLookup())document.getElementById('d-go').click()}">
        <a id="d-go" class="btn primary" href="${esc(d.q ? oaldURL(d.q) : OALD)}" target="_blank" rel="noopener" onclick="return dictLookup()">Look up</a>
      </div>
      <p class="small muted" style="margin:8px 0 0">The dictionary opens in a new window. ${IS_IOS && STANDALONE ? 'Tap <b>Done</b> to come back to the app.' : 'Switch back to this tab afterwards – your entries stay here.'}</p>
    </div>
    <div class="card">
      <div class="spread"><h3 style="margin:0">Add to my list</h3>${(d.en||d.de||d.def||d.ex) ? `<button class="btn ghost sm" onclick="dictClear()">Clear</button>` : ''}</div>
      ${fld('en','English word or phrase','e.g. to binge-watch sth', false, false)}
      <label class="f">Word class</label>
      <div class="wcls">${WCLS.map(([k,l]) => `<button class="chip ${d.cls===k?'on':''}" onclick="dictClass('${k}')">${l}</button>`).join('')}</div>
      ${fld('de','German','e.g. am Stück schauen', false, false)}
      ${fld('def','English explanation <span class="muted" style="font-weight:400">(copy it from the dictionary)</span>','to watch many episodes of a series one after the other', true, true)}
      ${fld('ex','Example sentence <span class="muted" style="font-weight:400">(from the dictionary or your own)</span>','We binge-watched the whole season in one weekend.', true, true)}
      <div id="d-exhint" class="hint"></div>
      <label class="f">Add to list</label>
      <select id="d-set" onchange="dictSetChange(this)">
        ${cur ? '' : `<option value="" selected>${esc(DICT_SET)} (new)</option>`}
        ${sets.map(s => `<option value="${s.id}" ${s.id===cur?'selected':''}>${esc(s.name)}</option>`).join('')}
        <option value="__new">+ New list …</option>
      </select>
      <div class="actions"><button class="btn primary big" onclick="dictAdd()">＋ Add word</button></div>
    </div>
    ${recent.length ? `<div class="card"><h3>Recently added</h3><ul class="wl">${recent.map(c => `<li onclick="editWord('${c.id}')"><div class="w"><b>${esc(headword(c.en))}</b> <span class="small muted">${esc(wordClass(c.en))}</span><div>${esc(c.de||c.def||'')}</div></div><span class="due">${esc((DB.sets[c.set]||{}).name||'')}</span></li>`).join('')}</ul></div>` : ''}`;
  dictHint();
}

function readFile(inp){
  const f = inp.files[0]; if(!f) return;

  r.readAsText(f);
}
function previewImport(){
  const text = document.getElementById('imp-text').value, name = document.getElementById('imp-name').value.trim() || 'My words';
  if(isProgressCode(text)){ receiveModal(text.trim()); return; }
  const box = document.getElementById('imp-prev');
  let data;
  try{ data = parseInput(text, name); }catch(e){ box.innerHTML = `<div class="fb bad" style="margin-top:12px">${esc(e.message)}</div>`; return; }
  const words = previewWords(data).map(normWord).filter(Boolean);
  if(!words.length){ box.innerHTML = `<div class="fb bad" style="margin-top:12px">No words recognised. Check the format below.</div>`; return; }
  PENDING = {text, name, data};
  const setName = data.set || (data.sets ? data.sets.map(s=>s.set||s.name).join(', ') : name);
  box.innerHTML = `<div class="fb ok" style="margin-top:12px">

function doImport(){
  if(!PENDING) return;

    toast(`${r.added} new · ${r.updated} updated in “${r.sets.join(', ')}”`);
    go('words');
  }catch(e){ toast(e.message); }
}

      ${list.length ? `<button class="btn primary sm" onclick="copyText(DB.sentences.map(s=>s.word+': '+s.text).join('\\n'),'Sentences copied – paste them for your teacher.')">Copy all</button>` : ''}</div>
    <p class="small muted">Sentences you wrote in “My sentence” tasks. Ask your teacher or a partner to check them.</p>
    ${list.length ? list.map(s => `<div class="sent"><div class="spread"><b>${esc(s.word)}</b><button class="btn ghost sm" onclick="DB.sentences=DB.sentences.filter(x=>x.id!=='${s.id}');save();viewSentences()">Delete</button></div><div>${esc(s.text)}</div></div>`).join('')
      : '<p>No sentences yet. They appear once you know a word well – or choose “My sentence” on the start page.</p>'}
  </div>`;
}

function restoreModal(){
  modal(`<h3>Replace everything</h3><p class="small muted">Paste a code. This deletes everything on this device and replaces it with the code. To combine two devices, use <b>Receive progress</b> instead.</p>
    <textarea id="m-bk"></textarea>
    <div class="row" style="margin-top:10px"><label class="btn ghost sm" style="cursor:pointer">📄 Open file<input type="file" accept=".txt,.json,text/plain,application/json" style="display:none" onchange="const r=new FileReader();r.onload=()=>{document.getElementById('m-bk').value=r.result};r.readAsText(this.files[0])"></label></div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="restore()">Restore</button></div>`);
}
async function restore(){
  try{
    const d = await unpackProgress(document.getElementById('m-bk').value);
    if(!d.cards || !d.sets) throw 0;
    DB = Object.assign(blank(), d); DB.settings = Object.assign(blank().settings, d.settings||{});
    save(); closeModal(); toast('Backup restored'); go('today');
  }catch(e){ toast('This is not a valid backup code.'); }
}

/* ===================== Transfer between devices ===================== */
let DOWNLOADS = null;
function initDownloads(){ try{ if(!DOWNLOADS && window.claude && window.claude.use) window.claude.use('downloads').then(d => { if(d){ DOWNLOADS = d; if(VIEW==='options') render(); } }).catch(()=>{}); }catch(e){} }
initDownloads(); window.addEventListener('load', initDownloads);
function fmtStamp(ms){ return new Date(ms).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
function unb64(t){ const s = atob(t); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; }
async function packProgress(){
  const data = Object.assign({}, DB); delete data.meta;
  const json = JSON.stringify({kind:'vocab-trainer-progress', v:1, at:Date.now(), db:data});
  if('CompressionStream' in window){
    try{ const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); return 'VT1:' + b64(await new Response(st).arrayBuffer()); }catch(e){}
  }
  return json;
}
/* Tolerant reading of progress codes: copying via Notes, Messages, Mail etc. can add
   invisible characters, line breaks, quotes or text around the code. */
function cleanCode(text){ return String(text||'').replace(/[\u200B-\u200D\u2060\uFEFF\u00AD]/g,'').trim(); }
async function unpackProgress(text){
  text = cleanCode(text);
  const m = text.match(/VT1\s*[:：;.]?\s*([A-Za-z0-9+\/=_\-\s]{20,})/);
  if(m){
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old for transfer codes. Please update iOS/your browser.');
    let b = m[1].replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'');
    while(b.length % 4) b += '=';
    let bytes;
    try{ bytes = unb64(b); }catch(e){ throw new Error('This code is damaged. Copy it again – completely – or send it as a file.'); }
    try{ const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')); text = await new Response(st).text(); }
    catch(e){ throw new Error('This code is incomplete. Copy it again – completely – or send it as a file.'); }
  } else {
    const a = text.indexOf('{'), z = text.lastIndexOf('}');
    if(a < 0 || z <= a) throw new Error('This is not a progress code. Copy it again – completely.');
    text = text.slice(a, z+1);
  }
  let o;
  try{ o = JSON.parse(text); }catch(e){ throw new Error('This code is incomplete. Copy it again – completely – or send it as a file.'); }
  return o.db || o;
}
function isProgressCode(text){ const t = cleanCode(text); return /VT1\s*[:：;.]?\s*[A-Za-z0-9+\/=_\-]{20,}/.test(t) || (/^\{/.test(t) && /"cards"\s*:/.test(t) && /"sets"\s*:/.test(t)); }
async function sendProgress(){
  const code = await packProgress();
  DB.meta = Object.assign(DB.meta||{}, {sent:Date.now()}); save();
  const kb = Math.max(1, Math.round(code.length/1024));
  modal(`<h3>⬆ Send progress</h3>
    <p class="small">${cards().length} words · ${cards().filter(c=>c.reps).length} with progress · ${kb} KB</p>
    <div class="actions" style="margin-top:6px">
      <button class="btn primary" onclick="copyText(window._code,'Code copied – now paste it on your other device.')">Copy code</button>
      ${DOWNLOADS || !SANDBOXED ? `<button class="btn ghost" onclick="saveProgressFile()">${canShareFiles() ? 'Share as file (AirDrop …)' : 'Save as file'}</button>` : ''}
    </div>
    <p class="small muted" style="margin-top:10px">On the other device: Options → <b>Receive progress</b>.</p>
    <details><summary class="small">Show code</summary><textarea readonly onclick="this.select()" style="min-height:90px">${esc(code)}</textarea></details>
    <div class="actions"><button class="btn ghost" onclick="closeModal();render()">Close</button></div>`);
  window._code = code;
}
async function saveProgressFile(){
  try{
    const d = new Date(), stamp = d.toISOString().slice(0,10) + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
    const name = 'vocab-progress_' + stamp + '.txt';
    if(DOWNLOADS){ await DOWNLOADS.save({filename:name, data:window._code}); toast('File saved – AirDrop or send it to your other device.'); return; }
    const file = new File([window._code], name, {type:'text/plain'});
    if(canShareFiles(file)){ await navigator.share({files:[file], title:'Vocab Trainer progress'}); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('File saved in Downloads – send it to your other device.');
  }catch(e){ if(e && e.name !== 'AbortError') toast('Saving did not work – use “Copy code” instead.'); }
}
function receiveModal(prefill){
  modal(`<h3>⬇ Receive progress</h3>
    <p class="small muted">Paste the code from your other device, or open the file. Your progress here is kept – both devices are combined.</p>
    <textarea id="m-rx" placeholder="VT1:…">${esc(prefill||'')}</textarea>
    <div class="row" style="margin-top:10px">
      <label class="btn ghost sm" style="cursor:pointer">📄 Open file<input type="file" accept=".txt,.json,text/plain,application/json" style="display:none" onchange="const r=new FileReader();r.onload=()=>{document.getElementById('m-rx').value=r.result};r.readAsText(this.files[0])"></label>
      <span style="flex:1"></span>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="receiveProgress()">Combine</button>
    </div>`);
}
async function receiveProgress(){
  let o;
  try{ o = await unpackProgress(document.getElementById('m-rx').value); if(!o.cards || !o.sets) throw 0; }
  catch(e){ toast(e instanceof Error && !(e instanceof SyntaxError) && e.message ? e.message : 'This is not a valid progress code. Copy it again – completely.'); return; }
  const r = mergeProgress(o);
  closeModal();
  modal(`<h3>✅ Progress combined</h3>
    <div class="stats"><div class="stat"><b>${r.updated}</b><span>words updated</span></div><div class="stat"><b>${r.added}</b><span>new words</span></div><div class="stat"><b>${r.sets}</b><span>new lists</span></div></div>
    <p class="small muted">${r.kept} words were already more recent on this device and stayed as they are.</p>
    <div class="actions"><button class="btn primary" onclick="closeModal();go('today')">Go to today</button></div>`);
}
/* Merge another device's data: lists by name, words by list + English word.
   Per word, the more recent practice wins; nothing is replaced by older progress. */
function mergeProgress(o){
  let added = 0, updated = 0, kept = 0, newSets = 0;
  const map = {};
  for(const os of Object.values(o.sets||{})){
    let ls = findSetByName(os.name||'');
    if(!ls){ ls = Object.assign({}, os, {id:uid()}); DB.sets[ls.id] = ls; newSets++; }
    else if(os.test != null && (ls.test == null || ls.test < dayNum())){ ls.test = os.test; if(os.testName) ls.testName = os.testName; }
    map[os.id] = ls.id;
  }
  const idx = {}; cards().forEach(c => idx[c.set + '|' + norm(c.en)] = c);
  const idMap = {};
  for(const oc of Object.values(o.cards||{})){
    const sid = map[oc.set]; if(!sid || !oc.en) continue;
    const key = sid + '|' + norm(oc.en); let lc = idx[key];
    if(!lc){ const id = uid(); lc = DB.cards[id] = Object.assign({}, oc, {id, set:sid, n:++DB.seq}); idx[key] = lc; idMap[oc.id] = id; added++; continue; }
    idMap[oc.id] = lc.id;
    const oL = oc.reps ? (oc.last ?? -1) : -2, lL = lc.reps ? (lc.last ?? -1) : -2;
    if(oL > lL || (oL === lL && (oc.reps||0) > (lc.reps||0))){ ['s','d','due','last','reps','lapses'].forEach(k => lc[k] = oc[k]); updated++; }
    else if(oc.reps) kept++;
    if(oc.prep && (!lc.prep || (oc.prep.test === lc.prep.test ? (oc.prep.n > lc.prep.n || (oc.prep.n === lc.prep.n && oc.prep.t > lc.prep.t)) : oc.prep.t > (lc.prep.t||0)))) lc.prep = Object.assign({}, oc.prep);
  }
  const have = new Set(DB.sentences.map(x => x.id));
  for(const x of (o.sentences||[])) if(!have.has(x.id)) DB.sentences.push(Object.assign({}, x, {card: idMap[x.card] || x.card}));
  DB.sentences.sort((a,b) => (b.day||0) - (a.day||0));
  for(const k in (o.history||{})) DB.history[k] = Math.max(DB.history[k]||0, o.history[k]);
  touchDaily(); if(o.daily && o.daily.day === DB.daily.day) DB.daily.newCount = Math.max(DB.daily.newCount, o.daily.newCount||0);
  DB.meta = Object.assign(DB.meta||{}, {got:Date.now()});
  save();
  return {added, updated, kept, sets:newSets};
}


/* ===================== One-click backup ===================== */
const BACKUP_EVERY = 7;
function backupInfo(){
  const b = DB.meta && DB.meta.backup;
  return b ? `Last backup: ${fmtStamp(b)}.` : 'You have not saved a backup yet.';
}
function backupDue(){
  if(cards().filter(c => c.reps).length < 10) return false;
  const b = DB.meta && DB.meta.backup;
  return !b || dayNum() - cardDay(b) >= BACKUP_EVERY;
}
function backupName(){ const d = new Date(); return 'vocab-backup_' + d.toISOString().slice(0,10) + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + '.txt'; }
function backupDone(){ DB.meta = Object.assign(DB.meta||{}, {backup:Date.now()}); save(); if(VIEW==='options' || VIEW==='today') render(); }
async function backupNow(){
  const code = await packProgress(), name = backupName();
  window._code = code;
  try{
    if(DOWNLOADS){ await DOWNLOADS.save({filename:name, data:code}); backupDone(); toast('Backup saved ✓'); return; }
    const file = new File([code], name, {type:'text/plain'});
    if(canShareFiles(file)){ await navigator.share({files:[file], title:'Vocab Trainer backup'}); backupDone(); toast('Backup saved ✓'); return; }
    if(SANDBOXED) throw Object.assign(new Error('blocked'), {name:'NotAllowedError'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    backupDone(); toast('Backup saved in Downloads ✓');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    // e.g. the browser blocked the share sheet: offer a second tap, or the code
    modal(`<h3>💾 Backup</h3><p class="small">Your backup is ready (${Math.max(1, Math.round(code.length/1024))} KB).</p>
      <div class="actions">
        ${DOWNLOADS || !SANDBOXED ? `<button class="btn primary" onclick="closeModal();saveProgressFile().then(backupDone)">Save as file</button>` : ''}
        <button class="btn ghost" onclick="copyText(window._code,'Backup code copied – paste it somewhere safe (e.g. Notes).');backupDone();closeModal()">Copy code</button>
      </div>
      <div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  }
}

/* ===================== Paste words from the clipboard ===================== */
async function pasteWords(){
  let text = '';
  try{ text = await navigator.clipboard.readText(); }catch(e){}
  if(!text || !text.trim()){
    go('import');
    setTimeout(() => { const t = document.getElementById('imp-text'); if(t){ t.focus(); } toast('Long-press in the box → Paste'); }, 50);
    return;
  }
  if(isProgressCode(text)){ receiveModal(text.trim()); return; }
  if(VIEW !== 'import') go('import');
  const t = document.getElementById('imp-text'); t.value = text; previewImport();
}

/* ===================== Hosting: offline app, install, storage ===================== */
const SANDBOXED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
function canShareFiles(file){ try{ return !!(navigator.canShare && navigator.canShare({files:[file || new File(['x'], 'x.txt', {type:'text/plain'})]})); }catch(e){ return false; } }
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let INSTALL_PROMPT = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_PROMPT = e; if(VIEW==='today') render(); });
if(!SANDBOXED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if(!SANDBOXED && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
function installNote(){
  if(SANDBOXED || STANDALONE || (DB.meta && DB.meta.hideInstall)) return '';
  const close = `<button class="btn ghost sm" onclick="DB.meta=Object.assign(DB.meta||{},{hideInstall:true});save();render()">Later</button>`;
  if(IS_IOS) return `<div class="warn"><b>📲 Put the app on your home screen:</b> tap <b>Share</b> (□↑) → <b>Add to Home Screen</b>. Then it opens like an app, works offline – and Safari cannot delete your progress (it may delete website data after 7 days without a visit).<div class="row" style="margin-top:8px">${close}</div></div>`;
  if(INSTALL_PROMPT) return `<div class="warn"><b>📲 Install the app</b> – it opens like an app, works offline and keeps your progress safe.<div class="row" style="margin-top:8px"><button class="btn primary sm" onclick="INSTALL_PROMPT.prompt();INSTALL_PROMPT.userChoice.finally(()=>{INSTALL_PROMPT=null;render()})">Install</button>${close}</div></div>`;
  return '';
}


/* ===================== Import via link (#import=…) from the class apps ===================== */
function b64urlToText(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
let LINK_IMPORT = null;
function checkLinkImport(){
  const h = location.hash || '';
  if(!h.startsWith('#import=')) return;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  let text, data;
  try{ text = b64urlToText(decodeURIComponent(h.slice(8))); data = JSON.parse(text); }
  catch(e){ toast('This link is broken – ask your teacher for the code.'); return; }
  const words = previewWords(data).map(normWord).filter(Boolean);
  if(!words.length){ toast('No words found in this link.'); return; }
  LINK_IMPORT = {data, text};
  const setName = data.set || 'My words';
  const exists = findSetByName(setName);
  const ios = IS_IOS && !STANDALONE;
  modal(`<h3>📥 Import words</h3>
    <p><b>${words.length} words</b> → list “${esc(setName)}”${exists ? ' <span class="muted small">– already there: words are updated, your progress stays.</span>' : ''}</p>
    <table class="prev"><tr><th>English</th><th>German</th></tr>${words.slice(0,5).map(w => `<tr><td>${esc(w.en)}</td><td>${esc(w.de||'')}</td></tr>`).join('')}${words.length>5 ? `<tr><td colspan="2" class="muted">… and ${words.length-5} more</td></tr>` : ''}</table>
    ${ios ? `<div class="card tint" style="margin:12px 0 0;padding:14px">
        <b>You use the Vocab Trainer from your home screen?</b>
        <ol class="small" style="padding-left:20px;margin:6px 0 10px"><li>Tap <b>Copy words</b>.</li><li>Open <b>Vocab Trainer</b> from your home screen.</li><li>Tap <b>📋 Paste words</b> on the start page.</li></ol>
        <button class="btn primary block" onclick="linkCopyForApp()">📋 Copy words</button>
        <p class="small muted" style="margin:8px 0 0">iPhone/iPad keep the home-screen app and Safari separate – that’s why this extra step is needed.</p>
      </div>
      <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ghost" onclick="linkImportNow()">Import in Safari</button></div>`
    : `<div class="actions"><button class="btn ghost" onclick="copyText(LINK_IMPORT.text,'Code copied – open the app → Import → paste.')">📋 Copy code</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="linkImportNow()">Import</button></div>`}`);
}
async function linkCopyForApp(){
  try{ await navigator.clipboard.writeText(LINK_IMPORT.text); }
  catch(e){ copyText(LINK_IMPORT.text); return; }
  modal(`<div class="done-hero"><div class="emoji">✅</div><h3>Words copied</h3>
    <p>Now open <b>Vocab Trainer</b> from your home screen and tap <b>📋 Paste words</b>.</p>
    <p class="small muted">You can close Safari.</p>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">OK</button></div></div>`);
}
function linkImportNow(){
  if(!LINK_IMPORT) return;
  try{ const r = importData(LINK_IMPORT.data, 'My words'); LINK_IMPORT = null; closeModal(); toast(`${r.added} new · ${r.updated} updated in “${r.sets.join(', ')}”`); go('words'); }
  catch(e){ toast(e.message); }
}
window.addEventListener('hashchange', checkLinkImport);

/* ===================== Boot ===================== */
load();
render();
checkLinkImport();
</script>
